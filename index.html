<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الماروز</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0b1c2c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .screen {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
        .logo-circle {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #d4af37, #aa771c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .title {
            font-size: 26px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 15px;
            color: #a0aec0;
            margin-bottom: 25px;
        }
        .card-box {
            background: #1a365d;
            border: 1px solid #d4af37;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 10px;
            margin-bottom: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
        }
        .btn-primary {
            background: #d4af37;
            color: #0b1c2c;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .address {
            margin-top: 15px;
            font-size: 13px;
            color: #cbd5e0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen">
        <div class="logo-circle">M</div>
        <div class="title">شركة الماروز ترحب بكم</div>
        <div class="subtitle">للتوريدات العامة والشحن والتخليص الجمركي</div>
    </div>

    <div id="main-screen" class="screen" style="display: none;">
        <div class="card-box">
            <div class="title" style="margin-bottom: 5px;">الماروز</div>
            <div class="subtitle">التوريدات العامة • الشحن • التخليص الجمركي</div>

            <a href="tel:01096262273" class="btn btn-primary">📞 الاتصال بالرقم الأول: 01096262273</a>
            <a href="tel:01001292630" class="btn btn-primary">📞 الاتصال بالرقم الثاني: 01001292630</a>
            <a href="https://maps.app.goo.gl/4dydQmmX5Z1GUEvK7" target="_blank" class="btn btn-secondary">📍 فتح موقع الشركة على الخريطة</a>

            <div class="address">
                العنوان: شارع محمود حسن عشري، النزهة، مصر الجديدة، القاهرة
            </div>
        </div>
    </div>

    <script>
        setTimeout(function() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
        }, 2500);
    </script>
</body>
</html>
